name: Check PASSETS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check core.js
          node --check app.js
          node --check tests/browser.test.cjs
      - name: Run core behavior tests
        run: node --test tests/core.test.cjs
